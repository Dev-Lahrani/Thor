name: 🐛 Bug report
description: Report something broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! ⚡
        Please fill in the details below — the more context, the faster the fix.
        **Security issues?** Use [private vulnerability reporting](https://github.com/Dev-Lahrani/Thor/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen vs. what actually happened?
      placeholder: A clear and concise description…
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '…'
        2. Click on '…'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Map / 3D Globe
        - Vulnerabilities page
        - Threat Intel page
        - Breaches page
        - Trends / charts
        - Export
        - Notifications / settings
        - Search
        - Build / tooling
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: feeds
    attributes:
      label: Did any feed show as degraded?
      description: Thor shows an orange "Some feeds unavailable" banner when a feed fails.
      options:
        - "No / didn't see a banner"
        - "Yes — nvd"
        - "Yes — kev"
        - "Yes — feodo"
        - "Yes — dshield"
        - "Yes — openphish"
        - "Yes — hibp"
        - "Multiple feeds"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 128 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Anything from DevTools console (F12), red text especially.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I tried a hard refresh / cleared localStorage
          required: false
